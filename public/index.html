<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f2a22">
  <meta name="description" content="친구들과 가상 칩으로 즐기는 6-max 링게임과 9-max 토너먼트 홀덤.">
  <title>RIVER — 친구들의 홀덤 테이블</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#app">본문으로 건너뛰기</a>
  <header class="header">
    <a class="brand" href="/" aria-label="RIVER 홈"><span class="brand-mark">♠</span> RIVER</a>
    <span id="account-indicator" class="header-note" hidden></span>
    <button type="button" id="logout-button" class="quiet" hidden>로그아웃</button>
  </header>
  <main id="app" tabindex="-1"></main>
  <div id="turn-announcement" class="sr-only" role="status" aria-live="polite"></div>
  <dialog id="invite" aria-labelledby="invite-title">
    <div class="dialog-head"><h2 id="invite-title">친구를 테이블로 초대해요</h2><button class="quiet" id="close-invite" aria-label="초대 닫기">닫기 ×</button></div>
    <p>아래 링크를 보내세요. 링크를 열고 로그인하면 참가 가능한 방에 바로 들어갑니다.</p>
    <label for="invite-link">초대 링크</label><input id="invite-link" readonly>
    <div class="invite-actions"><button class="primary" id="copy-invite">링크 복사</button><button class="outline" id="share-invite" hidden>공유 메뉴 열기</button></div>
    <p id="invite-feedback" role="status" class="form-note"></p>
  </dialog>
  <dialog id="bet-settings" aria-labelledby="bet-settings-title">
    <div class="dialog-head"><div><h2 id="bet-settings-title">베팅 사이즈 설정</h2><p id="bet-settings-context"></p></div><button type="button" class="quiet" id="close-bet-settings">닫기 ×</button></div>
    <form id="bet-settings-form">
      <section class="bet-settings-group"><h3>프리플롭 <small>4개</small></h3><div class="bet-size-list" id="preflop-size-list"></div></section>
      <section class="bet-settings-group"><h3>플랍 이후 <small>4~6개</small></h3><div class="bet-size-list" id="postflop-size-list"></div><button type="button" class="outline" id="add-postflop-size">+ 사이즈 추가</button></section>
      <div class="bet-settings-actions"><button type="submit" class="primary">저장</button></div>
    </form>
  </dialog>
  <dialog id="bet-calculator" aria-labelledby="bet-calculator-title">
    <div class="dialog-head"><h2 id="bet-calculator-title">베팅 금액 계산기</h2><button type="button" class="quiet" id="close-bet-calculator">닫기 ×</button></div>
    <p class="calculator-display" id="bet-calculator-display" aria-live="polite">0</p>
    <div class="calculator-keys" aria-label="숫자 키패드">
      <button type="button" data-calculator-key="7">7</button><button type="button" data-calculator-key="8">8</button><button type="button" data-calculator-key="9">9</button>
      <button type="button" data-calculator-key="4">4</button><button type="button" data-calculator-key="5">5</button><button type="button" data-calculator-key="6">6</button>
      <button type="button" data-calculator-key="1">1</button><button type="button" data-calculator-key="2">2</button><button type="button" data-calculator-key="3">3</button>
      <button type="button" data-calculator-key="clear">C</button><button type="button" data-calculator-key="0">0</button><button type="button" data-calculator-key="delete">⌫</button>
      <button type="button" class="calculator-thousands" data-calculator-key="000">000</button>
    </div>
    <p id="bet-calculator-help" class="form-note">칩 단위로 입력해 주세요.</p>
    <div class="bet-settings-actions"><button type="button" class="outline" id="cancel-bet-calculator">취소</button><button type="button" class="primary" id="apply-bet-calculator">적용</button></div>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
